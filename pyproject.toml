[project]
name = "jellyplex-watched"
version = "8.5.3"
description = "Sync watched between media servers locally"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "packaging>=26.2",
    "plexapi>=4.18.1",
    "pydantic>=2.13.3",
    "pydantic-settings[yaml]>=2.14.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "pytest>=9.0.3",
    "ty>=0.0.34",
    "types-requests>=2.33.0.20260408",
    "vulture>=2.16",
]
