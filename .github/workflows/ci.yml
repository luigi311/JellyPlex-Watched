name: CI
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - .gitignore
  pull_request:
    paths-ignore:
      - .gitignore

env:
  PYTHON_VERSION: "3.13"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: "Install dependencies"
        run: uv sync --frozen

      - name: "Run tests"
        run: uv run pytest -vvv

      - name: "Validate configuration documentation"
        run: uv run pytest -q test/test_documentation.py

      - name: "Validate authored CI YAML configurations"
        run: uv run pytest -q test/test_ci_configurations.py

      - name: "Run Ruff"
        run: uv run ruff check .

      - name: "Type-check configuration modules"
        run: uv run ty check src/settings.py src/legacy_settings.py src/runtime_paths.py

      - name: "Full type check (known baseline; non-blocking)"
        continue-on-error: true
        run: uv run ty check

  test:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: "Install dependencies"
        run: uv sync --frozen

      - name: "Install Docker Compose"
        run: sudo apt update

      - name: "Install Docker Compose package"
        run: sudo apt install -y docker-compose

      - name: "Checkout JellyPlex-Watched-CI"
        uses: actions/checkout@v4
        with:
          repository: luigi311/JellyPlex-Watched-CI
          path: JellyPlex-Watched-CI

      - name: "Start containers"
        run: JellyPlex-Watched-CI/start_containers.sh

      - name: "Wait for containers"
        run: sleep 15

      - name: "Show container logs"
        run: uv run test/show_ci_container_logs.py JellyPlex-Watched-CI

      - name: "Test Plex ENV"
        run: uv run test/run_ci_configuration.py --env-file test/ci_plex.env --check plex

      - name: "Test Plex YAML"
        run: uv run test/run_ci_configuration.py --yaml-file test/ci_plex.yaml --check plex

      - name: "Test Jellyfin ENV"
        run: uv run test/run_ci_configuration.py --env-file test/ci_jellyfin.env --check jellyfin

      - name: "Test Jellyfin YAML"
        run: uv run test/run_ci_configuration.py --yaml-file test/ci_jellyfin.yaml --check jellyfin

      - name: "Test Emby ENV"
        run: uv run test/run_ci_configuration.py --env-file test/ci_emby.env --check emby

      - name: "Test Emby YAML"
        run: uv run test/run_ci_configuration.py --yaml-file test/ci_emby.yaml --check emby

      - name: "Test Guids ENV"
        run: uv run test/run_ci_configuration.py --env-file test/ci_guids.env --check guids

      - name: "Test Guids YAML"
        run: uv run test/run_ci_configuration.py --yaml-file test/ci_guids.yaml --check guids

      - name: "Test Locations ENV"
        run: uv run test/run_ci_configuration.py --env-file test/ci_locations.env --check locations

      - name: "Test Locations YAML"
        run: uv run test/run_ci_configuration.py --yaml-file test/ci_locations.yaml --check locations

      - name: "Test Plex migrated YAML"
        run: uv run test/run_ci_configuration.py --migration --env-file test/ci_plex.env --check plex

      - name: "Test Plex prefixed YAML"
        run: uv run test/run_ci_configuration.py --env-file test/ci_prefixed.env --yaml-file test/ci_plex.yaml --check plex

      - name: "Test writing to servers ENV"
        env:
          CI_STATE_DIR: ${{ runner.temp }}/jpw-write-env-host
        run: uv run test/run_ci_configuration.py --env-file test/ci_write.env --check write --repeat 2 --state-dir "$CI_STATE_DIR"

      - name: "Stop containers before YAML write test"
        run: JellyPlex-Watched-CI/stop_containers.sh

      - name: "Reset CI server state before YAML write test"
        working-directory: JellyPlex-Watched-CI
        run: ./reset.sh

      - name: "Start containers for YAML write test"
        run: JellyPlex-Watched-CI/start_containers.sh

      - name: "Wait for YAML write test containers"
        run: sleep 15

      - name: "Test writing to servers YAML"
        env:
          CI_STATE_DIR: ${{ runner.temp }}/jpw-write-yaml-host
        run: uv run test/run_ci_configuration.py --yaml-file test/ci_write.yaml --check write --repeat 2 --state-dir "$CI_STATE_DIR"

  docker:
    runs-on: ubuntu-latest
    needs: pytest
    env:
      DEFAULT_VARIANT: alpine
      IMAGE: jellyplex-watched:smoke-${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile.alpine
            variant: alpine
          - dockerfile: Dockerfile.slim
            variant: slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: "Install dependencies"
        run: uv sync --frozen

      - name: "Install Docker Compose"
        run: sudo apt update

      - name: "Install Docker Compose package"
        run: sudo apt install -y docker-compose

      - name: "Checkout JellyPlex-Watched-CI"
        uses: actions/checkout@v4
        with:
          repository: luigi311/JellyPlex-Watched-CI
          path: JellyPlex-Watched-CI

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/jellyplex-watched,enable=${{ secrets.DOCKER_USERNAME != '' }}
            # Do not push to ghcr.io on PRs due to permission issues, only push if the owner is luigi311 so it doesnt fail on forks
            ghcr.io/${{ github.repository }},enable=${{ github.event_name != 'pull_request' && github.repository_owner == 'luigi311'}}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ matrix.variant == env.DEFAULT_VARIANT && startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,suffix=-${{ matrix.variant }},enable=${{ startsWith(github.ref, 'refs/tags/')  }}

            type=ref,event=branch,suffix=-${{ matrix.variant }}
            type=ref,event=branch,enable=${{ matrix.variant == env.DEFAULT_VARIANT }}

            type=ref,event=pr,suffix=-${{ matrix.variant }}
            type=ref,event=pr,enable=${{ matrix.variant == env.DEFAULT_VARIANT }}

            type=semver,pattern={{ version }},suffix=-${{ matrix.variant }}
            type=semver,pattern={{ version }},enable=${{ matrix.variant == env.DEFAULT_VARIANT }}

            type=semver,pattern={{ major }}.{{ minor }},suffix=-${{ matrix.variant }}
            type=semver,pattern={{ major }}.{{ minor }},enable=${{ matrix.variant == env.DEFAULT_VARIANT }}

            type=sha,suffix=-${{ matrix.variant }}
            type=sha,enable=${{ matrix.variant == env.DEFAULT_VARIANT }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build loadable Docker image for integration tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}

      - name: "Start containers"
        run: JellyPlex-Watched-CI/start_containers.sh

      - name: "Wait for containers"
        run: sleep 15

      - name: "Show container logs"
        run: uv run test/show_ci_container_logs.py JellyPlex-Watched-CI

      - name: "Test Plex ENV"
        run: uv run test/run_ci_configuration.py --image "$IMAGE" --env-file test/ci_plex.env --check plex

      - name: "Test Plex YAML"
        run: uv run test/run_ci_configuration.py --image "$IMAGE" --yaml-file test/ci_plex.yaml --check plex

      - name: "Test Jellyfin ENV"
        run: uv run test/run_ci_configuration.py --image "$IMAGE" --env-file test/ci_jellyfin.env --check jellyfin

      - name: "Test Jellyfin YAML"
        run: uv run test/run_ci_configuration.py --image "$IMAGE" --yaml-file test/ci_jellyfin.yaml --check jellyfin

      - name: "Test Emby ENV"
        run: uv run test/run_ci_configuration.py --image "$IMAGE" --env-file test/ci_emby.env --check emby

      - name: "Test Emby YAML"
        run: uv run test/run_ci_configuration.py --image "$IMAGE" --yaml-file test/ci_emby.yaml --check emby

      - name: "Test Guids ENV"
        run: uv run test/run_ci_configuration.py --image "$IMAGE" --env-file test/ci_guids.env --check guids

      - name: "Test Guids YAML"
        run: uv run test/run_ci_configuration.py --image "$IMAGE" --yaml-file test/ci_guids.yaml --check guids

      - name: "Test Locations ENV"
        run: uv run test/run_ci_configuration.py --image "$IMAGE" --env-file test/ci_locations.env --check locations

      - name: "Test Locations YAML"
        run: uv run test/run_ci_configuration.py --image "$IMAGE" --yaml-file test/ci_locations.yaml --check locations

      - name: "Test Plex migrated YAML"
        run: uv run test/run_ci_configuration.py --image "$IMAGE" --migration --env-file test/ci_plex.env --check plex

      - name: "Test Plex prefixed YAML"
        run: uv run test/run_ci_configuration.py --image "$IMAGE" --env-file test/ci_prefixed.env --yaml-file test/ci_plex.yaml --check plex

      - name: "Test writing to servers ENV"
        env:
          CI_STATE_DIR: ${{ runner.temp }}/jpw-write-env-${{ matrix.variant }}
        run: uv run test/run_ci_configuration.py --image "$IMAGE" --env-file test/ci_write.env --check write --repeat 2 --state-dir "$CI_STATE_DIR"

      - name: "Stop containers before YAML write test"
        run: JellyPlex-Watched-CI/stop_containers.sh

      - name: "Reset CI server state before YAML write test"
        working-directory: JellyPlex-Watched-CI
        run: ./reset.sh

      - name: "Start containers for YAML write test"
        run: JellyPlex-Watched-CI/start_containers.sh

      - name: "Wait for YAML write test containers"
        run: sleep 15

      - name: "Test writing to servers YAML"
        env:
          CI_STATE_DIR: ${{ runner.temp }}/jpw-write-yaml-${{ matrix.variant }}
        run: uv run test/run_ci_configuration.py --image "$IMAGE" --yaml-file test/ci_write.yaml --check write --repeat 2 --state-dir "$CI_STATE_DIR"

      - name: "Validate Docker startup paths"
        run: uv run test/docker_smoke.py --image "$IMAGE"

      - name: Login to DockerHub
        if: "${{ env.DOCKER_USERNAME != '' }}"
        id: docker_login
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Login to GitHub Container Registry
        if: "${{ github.event_name != 'pull_request' && github.repository_owner == 'luigi311' }}"
        id: ghcr_login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Push
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.docker_login.outcome == 'success' || steps.ghcr_login.outcome == 'success' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}

      - name: Image digest
        if: "${{ steps.build_push.outcome == 'success' }}"
        run: echo "${{ steps.build_push.outputs.digest }}"
